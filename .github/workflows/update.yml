name: refresh values

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch values
        run: python3 fetch_values.py

      - name: commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add values.json gem_prices.json values.lua
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "refresh values ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
